<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">NEXUS-100 Multi-Orchestrator Agent OS</title>
  <desc id="desc">Animated architecture banner showing ChatGPT and MCP routing through the Meta Orchestrator to 10 domains and 100 specialist agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071020"/>
      <stop offset="55%" stop-color="#0b1930"/>
      <stop offset="100%" stop-color="#071020"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58E8FF"/>
      <stop offset="50%" stop-color="#62F2AD"/>
      <stop offset="100%" stop-color="#A98BFF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="328" rx="27" fill="none" stroke="#244568"/>
  <text x="600" y="66" text-anchor="middle" fill="#EAF4FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="1.5">NEXUS-100</text>
  <text x="600" y="101" text-anchor="middle" fill="#91A5C6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Multi-Orchestrator Agent OS for governed AI planning and adaptive model strategy</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <g transform="translate(70,160)">
      <rect width="160" height="58" rx="12" fill="#0D203A" stroke="#58E8FF"/>
      <text x="80" y="25" fill="#EAF4FF">ChatGPT / Client</text>
      <text x="80" y="44" fill="#58E8FF" font-size="11">Host reasoning layer</text>
    </g>
    <g transform="translate(280,160)">
      <rect width="140" height="58" rx="12" fill="#0D203A" stroke="#58E8FF"/>
      <text x="70" y="25" fill="#EAF4FF">MCP Gateway</text>
      <text x="70" y="44" fill="#58E8FF" font-size="11">Streamable HTTP</text>
    </g>
    <g transform="translate(470,150)">
      <rect width="180" height="78" rx="14" fill="#102941" stroke="#62F2AD" stroke-width="1.5"/>
      <text x="90" y="30" fill="#EAF4FF">Meta Orchestrator</text>
      <text x="90" y="51" fill="#62F2AD" font-size="11">Capability + policy routing</text>
    </g>
    <g transform="translate(700,150)">
      <rect width="190" height="78" rx="14" fill="#102941" stroke="#A98BFF" stroke-width="1.5"/>
      <text x="95" y="30" fill="#EAF4FF">Adaptive Router</text>
      <text x="95" y="51" fill="#A98BFF" font-size="11">Model · effort · tokens</text>
    </g>
    <g transform="translate(940,160)">
      <rect width="190" height="58" rx="12" fill="#0D203A" stroke="#FFD27A"/>
      <text x="95" y="25" fill="#EAF4FF">10 Domains / 100 Agents</text>
      <text x="95" y="44" fill="#FFD27A" font-size="11">Governed specialists</text>
    </g>
  </g>

  <path id="pipeline" d="M230 189 H280 M420 189 H470 M650 189 H700 M890 189 H940" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" opacity=".85"/>
  <circle r="6" fill="#58E8FF" filter="url(#glow)">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M230 189 H940"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#62F2AD" filter="url(#glow)">
    <animateMotion begin="1.2s" dur="3.6s" repeatCount="indefinite" path="M230 189 H940"/>
    <animate attributeName="opacity" values="0;1;1;0" begin="1.2s" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#A98BFF" filter="url(#glow)">
    <animateMotion begin="2.4s" dur="3.6s" repeatCount="indefinite" path="M230 189 H940"/>
    <animate attributeName="opacity" values="0;1;1;0" begin="2.4s" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="282" text-anchor="middle" fill="#EAF4FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Read-only public MCP surface · protected internal control plane · backend paid inference disabled by default</text>
  <text x="600" y="307" text-anchor="middle" fill="#7386A8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Python 3.12 · FastAPI · FastMCP · Cloud Run · NEXUS service v0.6.1 · plugin package v1.0.1</text>
</svg>