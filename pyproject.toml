[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-100-agent-os"
version = "0.3.0"
description = "Governed Python AI Agent OS with 10 domain orchestrators, 100 specialist agents, MCP, persistence and execution"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "mcp>=1.10,<2",
  "httpx>=0.28,<1",
  "structlog>=25,<26",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["nexus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
