name: Python Agent OS CI
on:
  push:
    paths: ["nexus/**","tests/**","benchmarks/**","pyproject.toml","Dockerfile",".github/workflows/python-ci.yml"]
  pull_request:
    paths: ["nexus/**","tests/**","benchmarks/**","pyproject.toml","Dockerfile"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check nexus tests
      - run: pytest -q
      - run: python benchmarks/run.py
      - run: docker build -t nexus-100-agent-os:test .
