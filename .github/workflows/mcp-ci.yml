name: Legacy Node MCP CI
on:
  push:
    paths: ["server.js","package.json",".github/workflows/mcp-ci.yml"]
  pull_request:
    paths: ["server.js","package.json",".github/workflows/mcp-ci.yml"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run check
