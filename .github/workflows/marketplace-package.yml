name: Marketplace Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "marketplace/**"
      - "nexus/mcp_server.py"
      - "nexus/main.py"
      - "nexus/orchestrator.py"
      - "nexus/security.py"
      - "nexus/config.py"
      - "tests/test_marketplace_package.py"
      - "tests/test_api.py"
  pull_request:
    paths:
      - "marketplace/**"
      - "nexus/mcp_server.py"
      - "nexus/main.py"
      - "nexus/orchestrator.py"
      - "nexus/security.py"
      - "nexus/config.py"
      - "tests/test_marketplace_package.py"
      - "tests/test_api.py"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check nexus tests marketplace/build_release.py
      - run: pytest -q tests/test_marketplace_package.py tests/test_api.py
      - run: python marketplace/build_release.py
      - name: Inspect package contents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archives = list(Path("marketplace/dist").glob("nexus-100-plugin-*.zip"))
          assert len(archives) == 1, archives
          with ZipFile(archives[0]) as z:
              print("\n".join(z.namelist()))
              assert z.testzip() is None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-100-marketplace
          path: marketplace/dist/nexus-100-plugin-*.zip
          if-no-files-found: error
