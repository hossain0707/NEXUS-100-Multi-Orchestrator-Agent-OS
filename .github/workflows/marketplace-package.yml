name: Marketplace Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "marketplace/**"
      - "nexus/mcp_server.py"
      - "nexus/main.py"
      - "nexus/orchestrator.py"
      - "tests/test_marketplace_package.py"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_marketplace_package.py tests/test_api.py
      - run: python marketplace/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-100-marketplace
          path: marketplace/dist/nexus-100-plugin-1.0.0.zip
          if-no-files-found: error
